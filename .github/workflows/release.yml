name: Release

# Tag a commit with the version number (1.0.0, not v1.0.0) to publish.
# The tag, the plugin header and Stable tag must all agree; the job stops otherwise.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check, but do not commit to the WordPress.org SVN repository.'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check versions agree
        id: version
        run: |
          header=$(sed -n 's/^ \* Version:[[:space:]]*//p' wp-nopnoe.php | head -1 | tr -d '\r')
          stable=$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | head -1 | tr -d '\r')

          if [ -z "$header" ] || [ -z "$stable" ]; then
            echo "Could not read the version from wp-nopnoe.php or readme.txt." >&2
            exit 1
          fi
          if [ "$header" != "$stable" ]; then
            echo "Version mismatch: wp-nopnoe.php says $header, readme.txt says $stable." >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$header" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version $header." >&2
            exit 1
          fi

          echo "version=$header" >> "$GITHUB_OUTPUT"

      - name: Build the release zip
        run: |
          chmod +x bin/build-zip.sh
          bin/build-zip.sh

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: wp-nopnoe-${{ steps.version.outputs.version }}
          path: dist/wp-nopnoe.zip
          if-no-files-found: error

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/wp-nopnoe.zip \
            --title "${{ github.ref_name }}" \
            --generate-notes

      - name: Check for WordPress.org credentials
        id: svn
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        run: |
          if [ -n "$SVN_USERNAME" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "SVN_USERNAME is not set; skipping the WordPress.org deployment."
          fi

      - name: Deploy to the WordPress.org SVN repository
        if: github.ref_type == 'tag' && steps.svn.outputs.available == 'true'
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: wp-nopnoe
        with:
          dry-run: ${{ inputs.dry_run == true }}
